/* GERAR 18 MESES */

function gerarMeses(qtd){

    const meses = []

    const data = new Date()

    const nomes = [

        'janeiro',
        'fevereiro',
        'março',
        'abril',
        'maio',
        'junho',
        'julho',
        'agosto',
        'setembro',
        'outubro',
        'novembro',
        'dezembro'

    ]

    for(let i = 0; i < qtd; i++){

        const novaData = new Date(

            data.getFullYear(),

            data.getMonth() + i,

            1

        )

        const mes =
        nomes[novaData.getMonth()]

        const ano =
        String(novaData.getFullYear())
        .slice(-2)

        meses.push(

            `${mes}-${ano}`

        )

    }

    return meses

}

   GERAR 12 MESES PASSADOS

function gerarMesesPassados(qtd){

    const resultado = []

    const data = new Date()

    const nomes = [
        'janeiro',
        'fevereiro',
        'março',
        'abril',
        'maio',
        'junho',
        'julho',
        'agosto',
        'setembro',
        'outubro',
        'novembro',
        'dezembro'
    ]

    /*
       Começa 12 meses atrás
       e termina no mês anterior ao atual
    */

    for(let i = qtd; i >= 1; i--){

        const d = new Date(
            data.getFullYear(),
            data.getMonth() - i,
            1
        )

        const nomeMes =
            nomes[d.getMonth()]

        const ano =
            String(d.getFullYear())
            .slice(-2)

        resultado.push(
            `${nomeMes}-${ano}`
        )
    }

    return resultado
}

/* OCULTAR GRUPOS */
function toggleGrupo(grupo){

    gridOptions.columnDefs.forEach(col => {

        if(col.children){

            col.children.forEach(filho => {

                if(filho.grupo === grupo){

                   const coluna =
                    gridApi.getColumn(filho.field)

                    if(!coluna){

                        return

                    }

                    const visivel =
                    coluna.isVisible()

                    gridApi.setColumnsVisible(

                        [filho.field],

                        !visivel

                    )

                }

            })

        }

    })

}
